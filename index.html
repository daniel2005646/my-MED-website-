<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <title>MEDAC — Master Engineering Design and Construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header id="siteHeader">
    <a href="#top" class="brand">
      <span class="brand-mark"><img src="assets/img/logo.svg" alt="MEDAC logo"></span>
      <span>
        <span class="brand-name">MEDAC</span><br>
        <span class="brand-sub">Design & Construction</span>
      </span>
    </a>
    <nav>
      <a href="#services">Services</a>
      <a href="#industries">Industries</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
    <a href="#quote" class="btn btn-primary">Request a Quote</a>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero">
      <div class="hero-content">
        <p class="hero-subtitle" id="hero-subtitle"></p>
        <h1 id="hero-title"></h1>
        <p class="hero-desc" id="hero-desc"></p>
        <div class="hero-buttons">
          <a href="#" class="btn btn-primary" id="hero-btn-primary"></a>
          <a href="#" class="btn btn-secondary" id="hero-btn-secondary"></a>
        </div>
        <div class="stats" id="stats-container"></div>
      </div>
      <div class="hero-image">
        <img src="" alt="MEDAC engineering illustration" id="hero-image">
      </div>
    </section>

    <!-- SERVICES -->
    <section id="services" class="services">
      <span class="section-label" id="services-label"></span>
      <h2 id="services-title"></h2>
      <p class="section-desc" id="services-desc"></p>
      <div class="services-list" id="services-list"></div>
    </section>

    <!-- INDUSTRIES -->
    <section id="industries" class="industries">
      <span class="section-label" id="industries-label"></span>
      <h2 id="industries-title"></h2>
      <p class="section-desc" id="industries-desc"></p>
      <div class="industries-list" id="industries-list"></div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="about">
      <span class="section-label" id="about-label"></span>
      <h2 id="about-title"></h2>
      <div class="about-content">
        <div class="about-text">
          <div class="about-block">
            <h3 id="about-who-heading"></h3>
            <p id="about-who-text"></p>
          </div>
          <div class="about-block">
            <h3 id="about-vision-heading"></h3>
            <p id="about-vision-text"></p>
          </div>
          <div class="about-block">
            <h3 id="about-mission-heading"></h3>
            <p id="about-mission-text"></p>
          </div>
        </div>
        <div class="director">
          <img src="" alt="Director" id="director-photo">
          <h3 id="director-name"></h3>
          <p id="director-role"></p>
          <blockquote id="director-quote"></blockquote>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="contact">
      <span class="section-label" id="contact-label"></span>
      <h2 id="contact-title"></h2>
      <p id="contact-subtitle"></p>
    </section>
  </main>

  <script>
    fetch('content/home.json')
      .then(r => r.json())
      .then(data => {
        document.title = data.title;

        // Hero
        document.getElementById('hero-subtitle').textContent = data.hero.subtitle;
        document.getElementById('hero-title').innerHTML = data.hero.title_line1 + '<br>' + data.hero.title_line2 + ' <span class="highlight">' + data.hero.highlight + '</span>';
        document.getElementById('hero-desc').textContent = data.hero.description;
        document.getElementById('hero-btn-primary').textContent = data.hero.button_primary.text;
        document.getElementById('hero-btn-primary').href = data.hero.button_primary.url;
        document.getElementById('hero-btn-secondary').textContent = data.hero.button_secondary.text;
        document.getElementById('hero-btn-secondary').href = data.hero.button_secondary.url;
        document.getElementById('hero-image').src = data.hero.image;

        // Stats
        const statsContainer = document.getElementById('stats-container');
        data.stats.forEach(stat => {
          const div = document.createElement('div');
          div.className = 'stat';
          div.innerHTML = '<span class="stat-number">' + stat.number + '</span><span class="stat-label">' + stat.label + '</span>';
          statsContainer.appendChild(div);
        });

        // Services
        document.getElementById('services-label').textContent = data.services.section_label;
        document.getElementById('services-title').textContent = data.services.title;
        document.getElementById('services-desc').textContent = data.services.description;
        const servicesList = document.getElementById('services-list');
        data.services.items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'service-card';
          div.innerHTML = '<span class="service-number">' + item.number + '</span><h3>' + item.title + '</h3><p>' + item.description + '</p>';
          servicesList.appendChild(div);
        });

        // Industries
        document.getElementById('industries-label').textContent = data.industries.section_label;
        document.getElementById('industries-title').textContent = data.industries.title;
        document.getElementById('industries-desc').textContent = data.industries.description;
        const industriesList = document.getElementById('industries-list');
        data.industries.list.forEach(item => {
          const div = document.createElement('div');
          div.className = 'industry-item';
          div.textContent = item.name;
          industriesList.appendChild(div);
        });

        // About
        document.getElementById('about-label').textContent = data.about.section_label;
        document.getElementById('about-title').textContent = data.about.title;
        document.getElementById('about-who-heading').textContent = data.about.who_we_are.heading;
        document.getElementById('about-who-text').textContent = data.about.who_we_are.text;
        document.getElementById('about-vision-heading').textContent = data.about.vision.heading;
        document.getElementById('about-vision-text').textContent = data.about.vision.text;
        document.getElementById('about-mission-heading').textContent = data.about.mission.heading;
        document.getElementById('about-mission-text').textContent = data.about.mission.text;
        document.getElementById('director-photo').src = data.about.director.photo;
        document.getElementById('director-name').textContent = data.about.director.name;
        document.getElementById('director-role').textContent = data.about.director.role;
        document.getElementById('director-quote').textContent = data.about.director.quote;

        // Contact
        document.getElementById('contact-label').textContent = data.contact.section_label;
        document.getElementById('contact-title').textContent = data.contact.title;
        document.getElementById('contact-subtitle').textContent = data.contact.subtitle;
      })
      .catch(err => console.error('Error loading content:', err));
  </script>

</body>
</html>
