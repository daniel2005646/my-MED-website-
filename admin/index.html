<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
  <script>
    CMS.registerPreviewTemplate('home', function(props) {
      var h = props.createElement;
      var data = props.entry.toJS().data || {};
      var hero = data.hero || {};
      var services = data.services || {};
      var industries = data.industries || {};
      var about = data.about || {};
      var contact = data.contact || {};

      // Helper to create styled sections
      function section(children, bg, color) {
        return h('div', {style: {background: bg || '#fff', color: color || '#12161C', padding: '24px', fontFamily: 'Inter, sans-serif', marginBottom: '8px'}}, children);
      }

      return h('div', {style: {fontFamily: 'Inter, sans-serif', lineHeight: '1.6'}},
        // HERO
        section([
          h('p', {style: {color: '#F5B400', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '8px'}}, hero.subtitle),
          h('h1', {style: {fontSize: '28px', fontWeight: '700', fontFamily: 'Space Grotesk, sans-serif', marginBottom: '12px', lineHeight: '1.2'}}, 
            hero.title_line1, h('br'), hero.title_line2, ' ', h('span', {style: {color: '#F5B400'}}, hero.highlight)
          ),
          h('p', {style: {color: '#5B6472', marginBottom: '16px', maxWidth: '480px'}}, hero.description),
          h('div', {style: {display: 'flex', gap: '12px', marginBottom: '20px'}},
            h('span', {style: {background: '#F5B400', color: '#181203', padding: '10px 20px', borderRadius: '100px', fontWeight: '600', fontSize: '13px'}}, (hero.button_primary || {}).text || 'Start a project'),
            h('span', {style: {border: '1px solid rgba(18,22,28,0.2)', padding: '10px 20px', borderRadius: '100px', fontWeight: '600', fontSize: '13px'}}, (hero.button_secondary || {}).text || 'View services')
          ),
          h('div', {style: {display: 'flex', gap: '24px'}}, (data.stats || []).map(function(stat, i) {
            return h('div', {key: i}, 
              h('b', {style: {fontSize: '20px', fontFamily: 'Space Grotesk, sans-serif', display: 'block'}}, stat.number || stat.label),
              h('span', {style: {fontSize: '10px', color: '#9CA3AF', textTransform: 'uppercase', letterSpacing: '0.06em'}}, stat.number ? stat.label : '')
            );
          }))
        ], '#10141B', '#EDEDEA'),

        // SERVICES
        section([
          h('span', {style: {color: '#3D6FA8', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '8px', display: 'block'}}, services.section_label),
          h('h2', {style: {fontSize: '22px', fontWeight: '700', fontFamily: 'Space Grotesk, sans-serif', marginBottom: '8px'}}, services.title),
          h('p', {style: {color: '#5B6472', marginBottom: '16px'}}, services.description),
          h('div', null, (services.items || []).map(function(item, i) {
            return h('div', {key: i, style: {background: '#fff', padding: '16px', borderRadius: '12px', marginBottom: '10px', boxShadow: '0 2px 8px rgba(0,0,0,0.06)'}},
              h('span', {style: {float: 'right', fontSize: '11px', color: '#d8d5cb'}}, item.number),
              h('h3', {style: {fontSize: '15px', fontWeight: '600', marginBottom: '6px'}}, item.title),
              h('p', {style: {fontSize: '13px', color: '#5B6472', margin: 0}}, item.description)
            );
          }))
        ], '#F6F4EF'),

        // INDUSTRIES
        section([
          h('span', {style: {color: '#F5B400', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '8px', display: 'block'}}, industries.section_label),
          h('h2', {style: {fontSize: '22px', fontWeight: '700', fontFamily: 'Space Grotesk, sans-serif', marginBottom: '8px'}}, industries.title),
          h('div', {style: {display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(130px, 1fr))', gap: '10px'}}, 
            (industries.list || []).map(function(item, i) {
              return h('div', {key: i, style: {background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: '12px', padding: '14px', textAlign: 'center', fontSize: '13px'}}, item.name);
            })
          )
        ], '#181F29', '#EDEDEA'),

        // ABOUT
        section([
          h('span', {style: {color: '#3D6FA8', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '8px', display: 'block'}}, about.section_label),
          h('h2', {style: {fontSize: '22px', fontWeight: '700', fontFamily: 'Space Grotesk, sans-serif', marginBottom: '16px'}}, about.title),
          about.who_we_are ? h('div', {style: {marginBottom: '14px'}},
            h('span', {style: {color: '#3D6FA8', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '4px', display: 'block'}}, about.who_we_are.heading),
            h('p', {style: {color: '#5B6472', fontSize: '14px'}}, about.who_we_are.text)
          ) : null,
          about.vision ? h('div', {style: {marginBottom: '14px'}},
            h('span', {style: {color: '#3D6FA8', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '4px', display: 'block'}}, about.vision.heading),
            h('p', {style: {color: '#5B6472', fontSize: '14px'}}, about.vision.text)
          ) : null,
          about.mission ? h('div', {style: {marginBottom: '14px'}},
            h('span', {style: {color: '#3D6FA8', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '4px', display: 'block'}}, about.mission.heading),
            h('p', {style: {color: '#5B6472', fontSize: '14px'}}, about.mission.text)
          ) : null,
          about.director ? h('div', {style: {background: 'rgba(255,255,255,0.7)', padding: '20px', borderRadius: '16px', backdropFilter: 'blur(10px)', marginTop: '16px'}},
            h('h3', {style: {fontSize: '18px', marginBottom: '4px'}}, about.director.name),
            h('span', {style: {fontSize: '11px', color: '#5B6472', display: 'block', marginBottom: '10px'}}, about.director.role),
            h('p', {style: {fontSize: '14px', borderLeft: '2px solid #F5B400', paddingLeft: '12px', margin: 0}}, about.director.quote)
          ) : null
        ], '#F6F4EF'),

        // CONTACT
        section([
          h('span', {style: {color: '#F5B400', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '8px', display: 'block'}}, contact.section_label),
          h('h2', {style: {fontSize: '22px', fontWeight: '700', fontFamily: 'Space Grotesk, sans-serif', marginBottom: '8px'}}, contact.title),
          h('p', {style: {color: '#9CA3AF'}}, contact.subtitle)
        ], '#181F29', '#EDEDEA')
      );
    });
  </script>
</body>
</html>
