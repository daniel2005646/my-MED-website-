<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Wait for Decap to fully load
      setTimeout(function() {
        try {
          var React = window.React || (window.CMS && window.CMS.React);
          if (!React) {
            console.log('React not available for preview');
            return;
          }
          var h = React.createElement;

          function esc(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          }

          CMS.registerPreviewTemplate('home', function(props) {
            var data = props.entry.toJS().data || {};
            var hero = data.hero || {};
            var stats = data.stats || [];
            var services = data.services || {};
            var industries = data.industries || {};
            var about = data.about || {};
            var contact = data.contact || {};

            var heroImage = esc(hero.image || '/assets/img/hero.png');
            var ceoPhoto = esc((about.director || {}).photo || '/assets/img/ceo.jpg');

            var html = '<div style="font-family:Inter,sans-serif;">' +
              '<div style="background:#10141B;color:#EDEDEA;padding:30px;">' +
                '<p style="color:#F5B400;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">' + esc(hero.subtitle) + '</p>' +
                '<h1 style="font-size:32px;font-weight:700;font-family:Space Grotesk,sans-serif;margin-bottom:12px;line-height:1.2;">' + esc(hero.title_line1) + '<br>' + esc(hero.title_line2) + ' <span style="color:#F5B400;">' + esc(hero.highlight) + '</span></h1>' +
                '<p style="color:#9CA3AF;margin-bottom:16px;max-width:480px;">' + esc(hero.description) + '</p>' +
                '<div style="display:flex;gap:12px;margin-bottom:20px;">' +
                  '<span style="background:#F5B400;color:#181203;padding:10px 20px;border-radius:100px;font-weight:600;font-size:13px;">' + esc((hero.button_primary || {}).text || 'Start a project') + '</span>' +
                  '<span style="border:1px solid rgba(255,255,255,0.2);padding:10px 20px;border-radius:100px;font-weight:600;font-size:13px;color:#EDEDEA;">' + esc((hero.button_secondary || {}).text || 'View services') + '</span>' +
                '</div>' +
                '<div style="display:flex;gap:24px;">' +
                  stats.map(function(s) {
                    return '<div><b style="font-size:20px;font-family:Space Grotesk,sans-serif;display:block;">' + esc(s.number || s.label) + '</b><span style="font-size:10px;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.06em;">' + esc(s.number ? s.label : '') + '</span></div>';
                  }).join('') +
                '</div>' +
                '<img src="' + heroImage + '" style="max-width:100%;margin-top:20px;border-radius:16px;">' +
              '</div>' +

              '<div style="background:#F6F4EF;padding:30px;">' +
                '<p style="color:#3D6FA8;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">' + esc(services.section_label) + '</p>' +
                '<h2 style="font-size:24px;font-weight:700;font-family:Space Grotesk,sans-serif;margin-bottom:8px;color:#12161C;">' + esc(services.title) + '</h2>' +
                '<p style="color:#5B6472;margin-bottom:20px;">' + esc(services.description) + '</p>' +
                (services.items || []).map(function(item) {
                  return '<div style="background:#fff;padding:16px;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);">' +
                    '<span style="float:right;font-size:11px;color:#d8d5cb;">' + esc(item.number) + '</span>' +
                    '<h3 style="font-size:15px;font-weight:600;margin-bottom:6px;color:#12161C;">' + esc(item.title) + '</h3>' +
                    '<p style="font-size:13px;color:#5B6472;margin:0;">' + esc(item.description) + '</p>' +
                  '</div>';
                }).join('') +
              '</div>' +

              '<div style="background:#181F29;color:#EDEDEA;padding:30px;">' +
                '<p style="color:#F5B400;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">' + esc(industries.section_label) + '</p>' +
                '<h2 style="font-size:24px;font-weight:700;font-family:Space Grotesk,sans-serif;margin-bottom:12px;">' + esc(industries.title) + '</h2>' +
                '<div style="display:flex;flex-wrap:wrap;gap:10px;">' +
                  (industries.list || []).map(function(item) {
                    return '<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:14px;font-size:13px;">' + esc(item.name) + '</div>';
                  }).join('') +
                '</div>' +
              '</div>' +

              '<div style="background:#F6F4EF;padding:30px;">' +
                '<p style="color:#3D6FA8;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">' + esc(about.section_label) + '</p>' +
                '<h2 style="font-size:24px;font-weight:700;font-family:Space Grotesk,sans-serif;margin-bottom:16px;color:#12161C;">' + esc(about.title) + '</h2>' +
                (about.who_we_are ? '<div style="margin-bottom:14px;"><span style="color:#3D6FA8;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:4px;">' + esc(about.who_we_are.heading) + '</span><p style="color:#5B6472;font-size:14px;">' + esc(about.who_we_are.text) + '</p></div>' : '') +
                (about.director ? '<div style="background:rgba(255,255,255,0.7);padding:20px;border-radius:16px;">' +
                  '<h3 style="font-size:18px;margin-bottom:4px;color:#12161C;">' + esc(about.director.name) + '</h3>' +
                  '<span style="font-size:11px;color:#5B6472;display:block;margin-bottom:10px;">' + esc(about.director.role) + '</span>' +
                  '<p style="font-size:14px;border-left:2px solid #F5B400;padding-left:12px;margin:0;color:#12161C;">' + esc(about.director.quote) + '</p>' +
                '</div>' : '') +
              '</div>' +

              '<div style="background:#181F29;color:#EDEDEA;padding:30px;">' +
                '<p style="color:#F5B400;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">' + esc(contact.section_label) + '</p>' +
                '<h2 style="font-size:24px;font-weight:700;font-family:Space Grotesk,sans-serif;margin-bottom:8px;">' + esc(contact.title) + '</h2>' +
                '<p style="color:#9CA3AF;">' + esc(contact.subtitle) + '</p>' +
              '</div>' +
            '</div>';

            return h('div', {dangerouslySetInnerHTML: {__html: html}});
          });

          console.log('Decap preview template registered');
        } catch (err) {
          console.log('Preview template skipped:', err.message);
        }
      }, 1000);
    });
  </script>
</body>
</html>
