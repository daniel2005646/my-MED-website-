<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof CMS === 'undefined' || !CMS.React) {
        console.log('CMS preview styling not available');
        return;
      }
      
      try {
        var h = CMS.React.createElement;
        
        var HomePreview = function(props) {
          var data = props.entry.toJS().data || {};
          var hero = data.hero || {};
          var services = data.services || {};
          var industries = data.industries || {};
          var about = data.about || {};
          var contact = data.contact || {};
          
          var dark = {background:'#10141B', color:'#EDEDEA', padding:'30px'};
          var light = {background:'#F6F4EF', color:'#12161C', padding:'30px'};
          var accent = {color:'#F5B400'};
          var heading = {fontSize:'28px', fontWeight:'700', marginBottom:'12px', fontFamily:'Space Grotesk, sans-serif'};
          var text = {fontSize:'15px', lineHeight:'1.6', marginBottom:'16px'};
          var label = {fontSize:'11px', color:'#3D6FA8', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:'6px', display:'block'};
          
          return h('div', {style:{fontFamily:'Inter, sans-serif'}},
            // HERO
            h('div', {style:dark},
              h('span', {style:accent}, hero.subtitle || ''),
              h('h1', {style:heading}, hero.title_line1, h('br'), hero.title_line2, ' ', h('span', {style:accent}, hero.highlight)),
              h('p', {style:{...text, color:'#9CA3AF'}}, hero.description)
            ),
            
            // SERVICES
            h('div', {style:light},
              h('span', {style:label}, services.section_label),
              h('h2', {style:heading}, services.title),
              h('p', {style:text}, services.description),
              h('div', null, (services.items || []).map(function(item, i) {
                return h('div', {key:i, style:{background:'#fff', padding:'16px', borderRadius:'12px', marginBottom:'10px', boxShadow:'0 2px 8px rgba(0,0,0,0.08)'}},
                  h('span', {style:{fontSize:'11px', color:'#d8d5cb', float:'right'}}, item.number),
                  h('h3', {style:{fontSize:'16px', fontWeight:'600', marginBottom:'6px'}}, item.title),
                  h('p', {style:{fontSize:'13px', color:'#5B6472', margin:0}}, item.description)
                );
              }))
            ),
            
            // INDUSTRIES
            h('div', {style:dark},
              h('span', {style:{...label, color:'#F5B400'}}, industries.section_label),
              h('h2', {style:heading}, industries.title),
              h('div', {style:{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(140px, 1fr))', gap:'10px'}}, 
                (industries.list || []).map(function(item, i) {
                  return h('div', {key:i, style:{background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:'12px', padding:'16px', textAlign:'center'}}, item.name);
                })
              )
            ),
            
            // ABOUT
            h('div', {style:light},
              h('span', {style:label}, about.section_label),
              h('h2', {style:heading}, about.title),
              about.who_we_are ? h('div', {style:{marginBottom:'16px'}},
                h('span', {style:label}, about.who_we_are.heading),
                h('p', {style:text}, about.who_we_are.text)
              ) : null,
              about.director ? h('div', {style:{background:'rgba(255,255,255,0.7)', padding:'20px', borderRadius:'16px', backdropFilter:'blur(10px)'}},
                h('h3', {style:{fontSize:'18px', marginBottom:'4px'}}, about.director.name),
                h('span', {style:{fontSize:'11px', color:'#5B6472'}}, about.director.role),
                h('p', {style:{...text, borderLeft:'2px solid #F5B400', paddingLeft:'12px', marginTop:'10px'}}, about.director.quote)
              ) : null
            ),
            
            // CONTACT
            h('div', {style:dark},
              h('span', {style:{...label, color:'#F5B400'}}, contact.section_label),
              h('h2', {style:heading}, contact.title),
              h('p', {style:{...text, color:'#9CA3AF'}}, contact.subtitle)
            )
          );
        };
        
        CMS.registerPreviewTemplate('home', HomePreview);
      } catch (err) {
        console.log('Preview styling skipped:', err.message);
      }
    });
  </script>
</body>
</html>
